<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" aria-labelledby="cf-t cf-d"><desc>A dashed circle marks the intended landing site of the copy; a solid disk cascades down and to the right out of it in three progressively displaced bands — the copy missing its target.</desc><rect width="96" height="96" fill="#FBFCFD" stroke="#E3E7EE" rx="18"/><circle cx="36" cy="38" r="28" fill="none" stroke="#6B7488" stroke-dasharray="4 3" stroke-width="2"/><defs><clipPath id="a"><path d="M0 0h96v30H0z"/></clipPath><clipPath id="b"><path d="M0 30h96v22H0z"/></clipPath><clipPath id="c"><path d="M0 52h96v44H0z"/></clipPath></defs><g clip-path="url(#a)"><circle cx="42" cy="44" r="28" fill="#0A0E18"/></g><g clip-path="url(#b)"><circle cx="48" cy="48" r="28" fill="#0A0E18"/></g><g clip-path="url(#c)"><circle cx="58" cy="54" r="28" fill="#2563EB"/></g></svg>