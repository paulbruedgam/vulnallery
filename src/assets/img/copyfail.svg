<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="cf-t cf-d">
  <title id="cf-t">Copy Fail</title>
  <desc id="cf-d">A dashed circle marks the intended landing site of the copy; a solid disk cascades down and to the right out of it in three progressively displaced bands — the copy missing its target.</desc>

  <rect width="96" height="96" rx="18" fill="#FBFCFD" stroke="#E3E7EE"></rect>

  <!-- target: where the copy was supposed to land -->
  <circle cx="36" cy="38" r="28" fill="none" stroke="#6B7488" stroke-width="2" stroke-dasharray="4 3"></circle>

  <defs>
    <clipPath id="cf-b1"><rect x="0" y="0" width="96" height="30"></rect></clipPath>
    <clipPath id="cf-b2"><rect x="0" y="30" width="96" height="22"></rect></clipPath>
    <clipPath id="cf-b3"><rect x="0" y="52" width="96" height="44"></rect></clipPath>
  </defs>

  <!-- the actual copy: cascading off-target, down and to the right -->
  <g clip-path="url(#cf-b1)"><circle cx="42" cy="44" r="28" fill="#0A0E18"></circle></g>
  <g clip-path="url(#cf-b2)"><circle cx="48" cy="48" r="28" fill="#0A0E18"></circle></g>
  <g clip-path="url(#cf-b3)"><circle cx="58" cy="54" r="28" fill="#2563EB"></circle></g>
</svg>