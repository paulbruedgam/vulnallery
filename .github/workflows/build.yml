# Baut das Auslieferungspaket. Deployt wird nicht von hier, sondern auf dem eigenen Server.
#
# - Pull Request: prüfen und bauen, Paket als Artefakt (14 Tage)
# - Jeder Push auf main (also jeder Merge): zusätzlich Tag vJJJJ.MM.N und
#   GitHub-Release mit tar.gz, zip und SHA256SUMS. Das Server-Skript
#   deploy/pull-release.sh holt sich von dort die neueste Version.
#
# - Adventskalender: Vom 30.11. bis 24.12. baut ein Zeitplan kurz nach
#   Mitternacht (Berlin) ein neues Release, damit Archiv /de|en/advent/<jahr>/,
#   Feeds und Sitemap das Türchen des Tages enthalten. Der Server holt es mit
#   dem stündlichen Timer ab; die Startseite öffnet das Türchen ohnehin sofort.
#
# Der Tag wird in diesem Lauf mit "gh release create" angelegt. Ein separater
# Tag-Push würde mit dem GITHUB_TOKEN keinen weiteren Workflow auslösen.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 23:05 UTC = 00:05 Uhr MEZ am Folgetag
    - cron: "5 23 30 11 *"
    - cron: "5 23 1-24 12 *"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version bestimmen
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Prüfen und bauen
        run: ./bin/build.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnallery-${{ steps.version.outputs.value }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Merges nacheinander abarbeiten, damit keine Tag-Nummer doppelt vergeben wird.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nächste Version bestimmen
        id: version
        run: |
          # Zeitplan-Läufe bauen bewusst denselben Commit neu (neues Türchen)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && existing=$(git tag --points-at HEAD --list 'v*' | head -n1) && [ -n "$existing" ]; then
            echo "Commit ist bereits als $existing getaggt, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prefix="v$(date -u +%Y.%m)"
          last=$(git tag --list "${prefix}.*" | sed "s/^${prefix}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n1)
          next="${prefix}.$(( ${last:-0} + 1 ))"
          echo "Neue Version: $next"
          echo "value=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prüfen und bauen
        if: steps.version.outputs.skip == 'false'
        run: ./bin/build.sh "${{ steps.version.outputs.value }}"

      - name: Tag und Release anlegen
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          args=()
          if prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vulnallery $VERSION" \
            --generate-notes \
            "${args[@]}"
