# Link-Prüfung mit lychee (.github/workflows/links.yml)
# Viele Projektseiten sperren automatische Abrufe; 403 und 429 zählen daher
# nicht als toter Link. Tote Links zeigen sich als 404, 410, DNS- oder TLS-Fehler.
accept = ["200..=299", "403", "429"]
timeout = 30
max_retries = 3
retry_wait_time = 5
max_concurrency = 8
user_agent = "Mozilla/5.0 (compatible; vulnallery-linkcheck; +https://vulnallery.de/)"
exclude_path = ["dist"]
exclude = [
  # Platzhalter in den Adventstexten, kein echter Link
  "^ldap://",
  # Impressum/Datenschutz und Kontakt werden nicht geprüft
  "^mailto:",
]
