# Gemeinsame Sicherheits-Header, per include in jedem location-Block,
# weil nginx add_header aus übergeordneten Blöcken sonst nicht erbt.
# Die CSP entspricht dem <meta>-Tag in index.html, ergänzt um frame-ancestors.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# HSTS erst mit "; preload" ergänzen, wenn alle Subdomains dauerhaft HTTPS können.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Für ältere Browser zusätzlich zu frame-ancestors
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
