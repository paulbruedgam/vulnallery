# nginx-Konfiguration für vulnallery.de
# Ablage z. B. /etc/nginx/sites-available/vulnallery.de, Webroot /var/www/vulnallery/current
# Zertifikate z. B. per certbot oder acme.sh; Pfade unten anpassen.

server {
    listen 80;
    listen [::]:80;
    server_name vulnallery.de www.vulnallery.de;
    return 301 https://vulnallery.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vulnallery.de;
    ssl_certificate     /etc/letsencrypt/live/vulnallery.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vulnallery.de/privkey.pem;
    return 301 https://vulnallery.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # ab nginx 1.25.1; ältere Versionen: "listen 443 ssl http2;"
    server_name vulnallery.de;

    root  /var/www/vulnallery/current;
    index index.html;
    error_page 404 /404.html;

    ssl_certificate     /etc/letsencrypt/live/vulnallery.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vulnallery.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;

    # Sicherheits-Header: Datei nach /etc/nginx/snippets/ kopieren
    include snippets/vulnallery-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/atom+xml text/xml;

    # MIME-Typen kommen aus der globalen mime.types (http-Block). Kein eigener
    # types-Block hier: der würde alle Typen ersetzen, und mit nosniff blockiert
    # der Browser dann CSS und JS. Fehlt webp/avif in mime.types, dort ergänzen.

    location = /index.html {
        include snippets/vulnallery-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Lückenseiten, Sitemap und Feeds ändern sich mit jedem Release
    location ~ ^/(de|en)/ {
        include snippets/vulnallery-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /sitemap.xml {
        include snippets/vulnallery-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /data/ {
        include snippets/vulnallery-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Logos, Schrift, Bilder: eine Woche cachen. CSS/JS sind per SRI an index.html gebunden.
    location /assets/ {
        include snippets/vulnallery-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;

        # Fremd-SVGs direkt aufgerufen: kein Script, kein Nachladen.
        location ~* \.svg$ {
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=604800" always;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien nie ausliefern (außer .well-known für ACME und security.txt)
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
